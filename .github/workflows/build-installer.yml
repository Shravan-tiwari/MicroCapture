name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish MicroCapture.UI (win-x64, self-contained)
        run: >
          dotnet publish MicroCapture.UI/MicroCapture.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Remove debug symbols
        run: Remove-Item -Recurse -Force publish/windows/*.pdb
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MicroCapture.iss'
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroCaptureSetup
          path: installer/output/MicroCaptureSetup.exe
